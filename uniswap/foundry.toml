[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
# Matches what OpenZeppelin's uniswap-hooks ships with. Benchmarks compare optimised Rust against
# optimised Solidity or they compare nothing.
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = false
ffi = true
fs_permissions = [{ access = "read-write", path = ".forge-snapshots/" }]

[lint]
lint_on_build = false
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]

[rpc_endpoints]
localhost = "http://127.0.0.1:8547"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum = "https://arb1.arbitrum.io/rpc"

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
