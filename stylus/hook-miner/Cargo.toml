[package]
name = "stylus-hook-miner"
description = "Mines a CREATE2 salt so a Stylus contract deploys to a Uniswap v4 hook address"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
alloy-primitives = { version = "1.5.7", features = ["std", "tiny-keccak"] }
alloy-dyn-abi = "1.5.7"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
stylus-uniswap-v4 = { path = "../base-hook" }

[[bin]]
name = "hook-miner"
path = "src/main.rs"
