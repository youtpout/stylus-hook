[package]
name = "stylus-native-stableswap"
description = "A Uniswap v4 StableSwap curve hook written entirely in Rust for Arbitrum Stylus"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
stylus-sdk.workspace = true
stylus-uniswap-v4 = { path = "../base-hook" }

[dev-dependencies]
stylus-sdk = { workspace = true, features = ["stylus-test"] }

[features]
export-abi = ["stylus-sdk/export-abi", "stylus-uniswap-v4/export-abi"]
debug = ["stylus-sdk/debug"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]
