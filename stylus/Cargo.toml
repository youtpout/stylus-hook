[workspace]
resolver = "2"
members = ["base-hook", "native-counter", "native-compute", "native-stableswap", "native-twamm", "native-gaussian", "airdrop", "counter", "hook-miner"]
# `hook-miner` is a host-side CLI, not a contract: keep it out of the default wasm build.
default-members = ["base-hook", "native-counter", "native-compute", "native-stableswap", "native-twamm", "native-gaussian", "airdrop", "counter"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/youtpout/stylus-hook"
repository = "https://github.com/youtpout/stylus-hook"
keywords = ["arbitrum", "ethereum", "stylus", "alloy", "uniswap", "hook"]

[workspace.dependencies]
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
stylus-sdk = "0.10.9"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
