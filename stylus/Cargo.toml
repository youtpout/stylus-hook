[workspace]
resolver = "2"
members = ["base-hook", "base-hook-macros", "native-counter", "native-compute", "native-stableswap", "native-twamm", "native-gaussian", "airdrop", "counter", "hook-miner"]
# `hook-miner` is a host-side CLI, not a contract: keep it out of the default wasm build.
default-members = ["base-hook", "base-hook-macros", "base-hook-macros", "native-counter", "native-compute", "native-stableswap", "native-twamm", "native-gaussian", "airdrop", "counter"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/youtpout/stylus-hook"
repository = "https://github.com/youtpout/stylus-hook"
keywords = ["arbitrum", "ethereum", "stylus", "alloy", "uniswap", "hook"]

[workspace.dependencies]
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }
stylus-sdk = "0.10.9"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
# Compiled for speed, not size.
#
# This is not the default you can reach on Stylus. rustc emits `memory.copy` at the speed levels,
# that brings a `DataCount` section, and ArbOS refuses to activate the contract with
# "unsupported section type DataCountSection" — the build succeeds, `cargo stylus check` passes, and
# the failure only shows up at activation. Every crate's `Stylus.toml` therefore passes
# `--llvm-memory-copy-fill-lowering` to wasm-opt, which lowers those ops back to loops and drops the
# section. On the Gaussian contract the pair is worth 2x the gas for about 200 extra bytes, and every
# benchmark in this repository before that discovery was measuring size-optimised code.
opt-level = 3

